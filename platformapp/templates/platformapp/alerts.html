{% extends 'platformapp/base.html' %}
{% block content %}
<div class="section-title"><h2>Duýduryşlar</h2><span class="badge">Attack Intelligence</span></div>
<div class="card">
<form method="get" class="quick-actions">
<select name="type">
<option value="">Ählisi</option><option value="ddos">DDoS</option><option value="phishing">Phishing</option><option value="malware">Malware</option><option value="other">Beýleki</option>
</select>
<button class="btn">Süz</button></form>
</div>
<div class="card" style="margin-top:1rem;">
  <div class="feed">
  {% for t in threats %}
    <div class="feed-item"><strong>{{ t.title }}</strong> — {{ t.get_attack_type_display }} — <span class="badge badge-danger">dereje {{ t.severity }}</span></div>
  {% empty %}<div class="muted">Howp ýok</div>{% endfor %}
  </div>
</div>
{% endblock %}
